name: Manage Default Keywords

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What would you like to do?"
        required: true
        type: choice
        default: "View current defaults"
        options:
          - "View current defaults"
          - "Add to defaults"
          - "Remove from defaults"
          - "Replace all defaults"
          - "Reset to factory defaults"
      keywords:
        description: "Comma-separated keywords (supports Shree + Cement, ACC -cargo)"
        required: false
        type: string
      exclusions:
        description: "Comma-separated words to ignore nearby, e.g. Air Cargo, Sahar"
        required: false
        type: string
      run_monitor_now:
        description: "Immediately run a fresh scan and update the live report after saving?"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: cestat-monitor
  cancel-in-progress: false

jobs:
  manage-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Apply keyword update
        env:
          ACTION: ${{ inputs.action }}
          KEYWORDS: ${{ inputs.keywords }}
          EXCLUSIONS: ${{ inputs.exclusions }}
        run: |
          python -m cestat_monitor.manage_keywords \
            --action "$ACTION" \
            --keywords "$KEYWORDS" \
            --exclusions "$EXCLUSIONS" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Commit updated defaults
        id: commit
        run: |
          if git diff --quiet config/keywords.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/keywords.json
            git commit -m "Update default keywords via GitHub Actions"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger fresh monitor run
        if: inputs.run_monitor_now && inputs.action != 'View current defaults'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run monitor.yml -f update_live_report=true
