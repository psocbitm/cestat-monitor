name: CESTAT keyword monitor

on:
  schedule:
  # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"
  # 9:00 PM IST = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      keywords:
        description: "Comma-separated terms, e.g. Ultratech, Shree + Cement, ACC -cargo (blank = saved defaults)"
        required: false
        type: string
      keyword_mode:
        description: "How to apply the keywords above"
        required: false
        type: choice
        default: "Add to saved defaults"
        options:
          - "Add to saved defaults"
          - "Search ONLY these keywords"
      exclude:
        description: "Comma-separated words to ignore nearby, e.g. Air Cargo, Sahar"
        required: false
        type: string
      match_style:
        description: "Matching style"
        required: false
        type: choice
        default: "Smart (Recommended)"
        options:
          - "Smart (Recommended)"
          - "Exact / Case-sensitive"
      start_date:
        description: "Start date DD-MM-YYYY (blank = today in IST)"
        required: false
        type: string
      days:
        description: "Number of days to check"
        required: false
        type: choice
        default: "7"
        options:
          - "7"
          - "6"
          - "5"
          - "4"
          - "3"
          - "2"
          - "1"
      benches:
        description: "Optional comma-separated benches, e.g. Delhi, Mumbai (blank = all)"
        required: false
        type: string
      update_live_report:
        description: "Update the public GitHub Pages dashboard? (Leave unchecked for one-off test searches)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cestat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run monitor
        env:
          START_DATE: ${{ inputs.start_date }}
          KEYWORDS: ${{ inputs.keywords }}
          KEYWORD_MODE: ${{ inputs.keyword_mode || 'Add to saved defaults' }}
          EXCLUDE: ${{ inputs.exclude }}
          MATCH_STYLE: ${{ inputs.match_style || 'Smart (Recommended)' }}
          DAYS: ${{ inputs.days || '7' }}
          BENCHES: ${{ inputs.benches }}
        run: |
          set -o pipefail
          python -m cestat_monitor.main \
            --start-date "$START_DATE" \
            --keywords "$KEYWORDS" \
            --keyword-mode "$KEYWORD_MODE" \
            --exclude "$EXCLUDE" \
            --match-style "$MATCH_STYLE" \
            --days "$DAYS" \
            --bench "$BENCHES" \
            2>&1 | tee monitor.log

      - name: Publish job summary
        if: always() && hashFiles('output/summary.md') != ''
        run: |
          {
            echo ""
            if [ "${{ github.event_name != 'workflow_dispatch' || inputs.update_live_report }}" = "true" ]; then
              echo "**Full report:** https://psocbitm.github.io/cestat-monitor/"
            else
              echo "**Live dashboard:** Not updated (one-off search). Download \`cestat-report-${{ github.run_id }}\` below for the full HTML report."
            fi
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> output/summary.md
          cat output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cestat-report-${{ github.run_id }}
          path: |
            output/
            monitor.log
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy report to GitHub Pages
        if: always() && hashFiles('output/index.html') != '' && (github.event_name != 'workflow_dispatch' || inputs.update_live_report)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          keep_files: false
          commit_message: "Update CESTAT report"
