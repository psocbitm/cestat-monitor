name: CESTAT keyword monitor

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date DD-MM-YYYY; blank means today in Asia/Kolkata"
        required: false
        type: string
      keywords:
        description: "Optional multiline keywords; blank uses config/keywords.json"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cestat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run monitor
        env:
          START_DATE: ${{ inputs.start_date }}
          KEYWORDS: ${{ inputs.keywords }}
        run: |
          set -o pipefail
          python -m cestat_monitor.main \
            --start-date "$START_DATE" \
            --keywords "$KEYWORDS" \
            2>&1 | tee monitor.log

      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cestat-report-${{ github.run_id }}
          path: |
            output/
            monitor.log
          retention-days: 7
          if-no-files-found: warn
