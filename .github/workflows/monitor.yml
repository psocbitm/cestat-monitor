name: CESTAT keyword monitor

on:
  schedule:
  # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"
  # 9:00 PM IST = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date DD-MM-YYYY; blank means today in Asia/Kolkata"
        required: false
        type: string
      keywords:
        description: "Optional multiline keywords; blank uses config/keywords.json"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cestat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run monitor
        env:
          START_DATE: ${{ inputs.start_date }}
          KEYWORDS: ${{ inputs.keywords }}
        run: |
          set -o pipefail
          python -m cestat_monitor.main \
            --start-date "$START_DATE" \
            --keywords "$KEYWORDS" \
            2>&1 | tee monitor.log

      - name: Publish job summary
        if: always() && hashFiles('output/summary.md') != ''
        run: |
          {
            echo ""
            echo "**Full report:** https://psocbitm.github.io/cestat-monitor/"
            echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> output/summary.md
          cat output/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cestat-report-${{ github.run_id }}
          path: |
            output/
            monitor.log
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy report to GitHub Pages
        if: always() && hashFiles('output/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          keep_files: false
          commit_message: "Update CESTAT report"
